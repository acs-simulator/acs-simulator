# Pubblica il sito (pagina di presentazione + simulatore giocabile nel browser) su GitHub Pages.
#
# Una volta sola, nel repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Da lì in poi ogni push su main che tocca il simulatore o il sito aggiorna l'indirizzo
#   https://acs-simulator.github.io/acs-simulator/
name: Sito

on:
  push:
    branches: [main]
    paths:
      - 'renderer/**'
      - 'site/**'
      - 'tools/build-site.mjs'
      - '.github/workflows/sito.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
