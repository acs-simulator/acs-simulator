# Pubblica il sito (pagina di presentazione + simulatore giocabile nel browser) su GitHub Pages.
#
# Una volta sola, nel repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Da lì in poi ogni push su main che tocca il simulatore o il sito aggiorna l'indirizzo
#   https://acs-simulator.github.io/acs-simulator/
name: Sito

on:
  push:
    branches: [main]
    paths:
      - 'renderer/**'
      - 'site/**'
      - 'tools/build-site.mjs'
      - '.github/workflows/sito.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Due job, come raccomanda GitHub: la pubblicazione parte solo quando il job che costruisce è finito e l'archivio
  # del sito è registrato. Nello stesso job deploy-pages partiva meno di un secondo dopo il caricamento e a volte non
  # trovava ancora l'archivio ("No artifacts named github-pages"), e il sito restava indietro finché qualcuno non
  # rilanciava il workflow.
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # gli stessi controlli dei pacchetti: un simulatore rotto o sbilanciato non va online
      - run: node tools/check.mjs
      - run: node tools/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
